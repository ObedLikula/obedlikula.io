sans-serif; margin: 0; padding: 0; width: 100%; min-height: 100vh;">

    <b style="color: blue; font-size: 50px;">Pour tout contacts</b>
    <div style="margin: 20px;">
        <a href="index.html" title="Allez sur Accueil" class="btn btn-secondary" style="margin:10px;">Accueil</a>

    <div style="margin-top: 30px;">
        <img src="12.jpg" style="width:100px; height:100px; border-radius:100px;"/>
		<i style="color:green";><center style="font-size:12px;color:darkblue;">Obed LIKULA</center></i> <br>

	   <div style="width: 50%; margin: auto; padding: 20px; background-color: #eaf6ff; border-radius: 10px;">
    <center style="font-family:40px;color:blue;font-family:Eras Demi ITC;"> Contactez-nous via ce formulaire</center>
	   <hr>
	<form>
        <div style="text-align: left; margin-bottom: 15px;">
            <label for="nom">Votre nom</label><br>
            <input type="text" id="nom" placeholder="Entrez votre nom complet" style="width: 100%; padding: 10px; border-radius: 5px;">
        </div>

        <div style="text-align: left; margin-bottom: 15px;">
            <label for="email">Votre adresse mail</label><br>
            <input type="email" id="email" placeholder="Entrez votre adresse mail" style="width: 100%; padding: 10px; border-radius: 5px;">
        </div>

        <div style="text-align: left; margin-bottom: 15px;">
            <label for="message">Message (Motif)</label><br>
            <textarea id="message" placeholder="Entrez votre message" rows="5" style="width: 100%; padding: 10px; border-radius: 5px;"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Envoyer</button>
    </form>
</div><br><br><br>
	   </body>
